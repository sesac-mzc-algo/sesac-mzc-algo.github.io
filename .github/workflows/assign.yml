name: assign

on:
  push:
    branches:
      - main
    paths:
      - members/**
      - picks/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # picks/ 의 링크를 실제 문제로 등록하고, 랜덤 문제를 자동 배정한다
      - name: Register picks and assign random problems
        run: node tools/assign.mjs

      - run: npm run validate

      - name: Commit
        run: |
          if git diff --quiet -- weeks; then
            echo "새로 할당할 멤버가 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weeks
          git commit -m "chore: 고른 문제 등록 및 랜덤 문제 배정"
          git push
